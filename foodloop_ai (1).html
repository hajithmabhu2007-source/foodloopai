<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <script>
    const DB_NAME = 'FoodLoopAI_ProductionDB_v3';
    const DB_VERSION = 3;

    class DatabaseManager {
      constructor() {
        this.db = null;
        this.isReady = false;
      }

      async init() {
        return new Promise((resolve) => {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            const tables = [
              'users', 'institutions', 'ngos', 'food_records',
              'consumption_records', 'surplus_food', 'food_requests',
              'deliveries', 'food_safety_records', 'partnerships',
              'notifications', 'ai_predictions', 'analytics', 
              'impact_records', 'audit_logs'
            ];
            tables.forEach(tbl => {
              if (!db.objectStoreNames.contains(tbl)) {
                db.createObjectStore(tbl, { keyPath: 'id' });
              }
            });
          };
          req.onsuccess = (e) => {
            this.db = e.target.result;
            this.isReady = true;
            resolve(this.db);
          };
          req.onerror = () => {
            console.warn('IndexedDB fallback to localStorage engine active.');
            resolve(null);
          };
        });
      }

      async getAll(storeName) {
        if (!this.db) return JSON.parse(localStorage.getItem('FL_' + storeName) || '[]');
        return new Promise((resolve) => {
          try {
            const tx = this.db.transaction(storeName, 'readonly');
            const store = tx.objectStore(storeName);
            const req = store.getAll();
            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => resolve([]);
          } catch(err) {
            resolve([]);
          }
        });
      }

      async get(storeName, id) {
        if (!this.db) {
          const list = JSON.parse(localStorage.getItem('FL_' + storeName) || '[]');
          return list.find(x => x.id === id) || null;
        }
        return new Promise((resolve) => {
          try {
            const tx = this.db.transaction(storeName, 'readonly');
            const store = tx.objectStore(storeName);
            const req = store.get(id);
            req.onsuccess = () => resolve(req.result || null);
            req.onerror = () => resolve(null);
          } catch(e) {
            resolve(null);
          }
        });
      }

      async put(storeName, record) {
        if (!record.id) record.id = 'rec_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
        record.updated_at = new Date().toISOString();
        if (!record.created_at) record.created_at = record.updated_at;

        if (!this.db) {
          const list = JSON.parse(localStorage.getItem('FL_' + storeName) || '[]');
          const idx = list.findIndex(x => x.id === record.id);
          if (idx >= 0) list[idx] = record; else list.push(record);
          localStorage.setItem('FL_' + storeName, JSON.stringify(list));
          return record;
        }

        return new Promise((resolve, reject) => {
          try {
            const tx = this.db.transaction(storeName, 'readwrite');
            const store = tx.objectStore(storeName);
            const req = store.put(record);
            req.onsuccess = () => resolve(record);
            req.onerror = (e) => reject(e);
          } catch(e) {
            reject(e);
          }
        });
      }

      async delete(storeName, id) {
        if (!this.db) {
          let list = JSON.parse(localStorage.getItem('FL_' + storeName) || '[]');
          list = list.filter(x => x.id !== id);
          localStorage.setItem('FL_' + storeName, JSON.stringify(list));
          return true;
        }
        return new Promise((resolve) => {
          try {
            const tx = this.db.transaction(storeName, 'readwrite');
            const store = tx.objectStore(storeName);
            const req = store.delete(id);
            req.onsuccess = () => resolve(true);
            req.onerror = () => resolve(false);
          } catch(e) {
            resolve(false);
          }
        });
      }

      async clearAll() {
        const tables = [
          'users', 'institutions', 'ngos', 'food_records',
          'consumption_records', 'surplus_food', 'food_requests',
          'deliveries', 'food_safety_records', 'partnerships',
          'notifications', 'ai_predictions', 'analytics', 
          'impact_records', 'audit_logs'
        ];
        for (const t of tables) {
          localStorage.removeItem('FL_' + t);
          if (this.db) {
            try {
              const tx = this.db.transaction(t, 'readwrite');
              tx.objectStore(t).clear();
            } catch(e) {}
          }
        }
      }
    }

    const DB = new DatabaseManager();

    const CryptoUtil = {
      async hash(password) {
        try {
          const enc = new TextEncoder().encode(password + '-fl_salt_2026');
          const buf = await crypto.subtle.digest('SHA-256', enc);
          return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        } catch(e) {
          return btoa(password);
        }
      }
    };

    const Logger = {
      async log(userId, role, action, entity, entityId, details) {
        try {
          await DB.put('audit_logs', {
            user_id: userId || 'system',
            role: role || 'SYSTEM',
            action,
            entity,
            entity_id: entityId || '',
            details: typeof details === 'object' ? JSON.stringify(details) : details,
            timestamp: new Date().toISOString()
          });
        } catch(e) {
          console.warn('Audit logging skipped', e);
        }
      }
    };

    const Geo = {
      calculateDistance(lat1, lon1, lat2, lon2) {
        if (!lat1 || !lon1 || !lat2 || !lon2) return 3.2;
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return parseFloat((R * c).toFixed(1));
      }
    };

    const Store = {
      currentUser: null,
      currentView: 'landing',
      activeTab: 'dashboard',
      unreadNotificationsCount: 0,

      initSession() {
        const stored = sessionStorage.getItem('foodloop_user');
        if (stored) {
          try {
            this.currentUser = JSON.parse(stored);
          } catch(e) {
            this.currentUser = null;
          }
        }
      },

      setSession(user) {
        this.currentUser = user;
        if (user) {
          sessionStorage.setItem('foodloop_user', JSON.stringify(user));
        } else {
          sessionStorage.removeItem('foodloop_user');
        }
      }
    };

    const Notifications = {
      async send(userId, role, title, message, link = '') {
        const item = {
          user_id: userId,
          role,
          title,
          message,
          link,
          read: false,
          created_at: new Date().toISOString()
        };
        await DB.put('notifications', item);
        UI.showToast(title + ': ' + message, 'info');
        await this.refreshCount();
      },

      async refreshCount() {
        if (!Store.currentUser) return;
        const all = await DB.getAll('notifications');
        const userNotes = all.filter(n => (n.user_id === Store.currentUser.id || n.role === Store.currentUser.role) && !n.read);
        Store.unreadNotificationsCount = userNotes.length;
        const badge = document.getElementById('notif-badge');
        if (badge) {
          badge.textContent = userNotes.length;
          badge.className = userNotes.length > 0 
            ? 'absolute -top-1 -right-1 w-5 h-5 bg-rose-500 text-white rounded-full text-xs flex items-center justify-center font-bold'
            : 'hidden';
        }
      }
    };

    const UI = {
      showToast(msg, type = 'success') {
        const c = document.getElementById('toast-container');
        if (!c) return;
        const el = document.createElement('div');
        const colors = {
          success: 'bg-emerald-600 text-white border-emerald-700',
          error: 'bg-rose-600 text-white border-rose-700',
          warning: 'bg-amber-500 text-white border-amber-600',
          info: 'bg-deep-900 text-white border-deep-800'
        };
        el.className = `${colors[type] || colors.info} border px-4 py-3 rounded-xl shadow-lg pointer-events-auto flex items-center space-x-3 transition-all duration-300 transform translate-y-2 max-w-sm`;
        el.innerHTML = `
          <div class="text-sm font-medium flex-1">${msg}</div>
          <button onclick="this.parentElement.remove()" class="text-white/80 hover:text-white">&times;</button>
        `;
        c.appendChild(el);
        setTimeout(() => {
          el.classList.remove('translate-y-2');
          el.classList.add('translate-y-0');
        }, 10);
        setTimeout(() => {
          el.remove();
        }, 4500);
      },

      openActionModal(title, htmlContent, maxWidth = 'max-w-2xl') {
        const modal = document.getElementById('action-modal');
        const card = document.getElementById('action-modal-card');
        card.className = `bg-white rounded-2xl shadow-2xl ${maxWidth} w-full p-6 relative my-8 border border-slate-100`;
        document.getElementById('action-modal-content').innerHTML = `
          <h2 class="text-xl font-bold text-slate-800 mb-4 pb-2 border-b border-slate-100">${title}</h2>
          <div>${htmlContent}</div>
        `;
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      },

      closeActionModal() {
        const modal = document.getElementById('action-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      },

      formatDate(dateStr) {
        if (!dateStr) return 'N/A';
        const d = new Date(dateStr);
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      }
    };

    const PartnershipService = {
      async getPartnershipsForInstitution(instId) {
        const all = await DB.getAll('partnerships');
        return all.filter(p => p.institution_id === instId);
      },

      async getPartnershipsForNGO(ngoId) {
        const all = await DB.getAll('partnerships');
        return all.filter(p => p.ngo_id === ngoId);
      },

      async isConnected(instId, ngoId) {
        const all = await DB.getAll('partnerships');
        return all.some(p => p.institution_id === instId && p.ngo_id === ngoId && p.status === 'ACCEPTED');
      },

      async requestConnection(ngoId, instId, requestedBy = 'NGO') {
        const all = await DB.getAll('partnerships');
        const existing = all.find(p => p.institution_id === instId && p.ngo_id === ngoId);
        
        if (existing) {
          if (existing.status === 'ACCEPTED') {
            UI.showToast('Already connected with this organization!', 'warning');
            return;
          }
          if (existing.status === 'PENDING') {
            UI.showToast('A connection request is already pending.', 'warning');
            return;
          }
        }

        const inst = await DB.get('institutions', instId);
        const ngo = await DB.get('ngos', ngoId);

        const newPartnership = {
          id: 'part_' + Math.random().toString(36).substr(2, 9),
          institution_id: instId,
          institution_name: inst ? inst.name : 'Institutional Kitchen',
          ngo_id: ngoId,
          ngo_name: ngo ? ngo.name : 'NGO / Trust',
          status: 'PENDING',
          requested_by: requestedBy,
          created_at: new Date().toISOString()
        };

        await DB.put('partnerships', newPartnership);

        // Alert target entity
        if (requestedBy === 'NGO') {
          await Notifications.send(instId, 'INSTITUTION', 'New Partnership Request', `${ngo ? ngo.name : 'An NGO'} has requested to become an approved Connection Partner to access your food surplus.`);
        } else {
          await Notifications.send(ngoId, 'NGO', 'Partnership Invitation', `${inst ? inst.name : 'An Institution'} invited your NGO to connect for surplus food distribution.`);
        }

        await Logger.log(Store.currentUser.id, Store.currentUser.role, 'REQUEST_PARTNERSHIP', 'partnerships', newPartnership.id, { instId, ngoId, requestedBy });
        UI.showToast('Partnership request sent successfully!');
      },

      async acceptConnection(partnershipId) {
        const part = await DB.get('partnerships', partnershipId);
        if (!part) return;

        part.status = 'ACCEPTED';
        part.accepted_at = new Date().toISOString();
        await DB.put('partnerships', part);

        // Notify other party
        const notifyTarget = part.requested_by === 'NGO' ? part.ngo_id : part.institution_id;
        const targetRole = part.requested_by === 'NGO' ? 'NGO' : 'INSTITUTION';
        await Notifications.send(notifyTarget, targetRole, 'Partnership Connected!', `Your partnership with ${part.institution_name} is now ACTIVE. You can now access and request surplus food.`);

        await Logger.log(Store.currentUser.id, Store.currentUser.role, 'ACCEPT_PARTNERSHIP', 'partnerships', part.id, 'Connection accepted');
        UI.showToast(`Partnership with ${part.ngo_name || part.institution_name} is now ACTIVE!`);
      },

      async rejectConnection(partnershipId) {
        const part = await DB.get('partnerships', partnershipId);
        if (!part) return;

        part.status = 'REJECTED';
        part.rejected_at = new Date().toISOString();
        await DB.put('partnerships', part);

        await Logger.log(Store.currentUser.id, Store.currentUser.role, 'REJECT_PARTNERSHIP', 'partnerships', part.id, 'Connection rejected');
        UI.showToast('Partnership request rejected.', 'info');
      }
    };

    const AIPredictor = {
      async generatePrediction(mealType, expectedAttendees) {
        const records = await DB.getAll('food_records');
        const filtered = records.filter(r => r.meal_type === mealType || !mealType);
        
        let baselineRatio = 0.82;
        if (filtered.length >= 2) {
          const totalPrepared = filtered.reduce((s, r) => s + (Number(r.quantity_prepared) || 0), 0);
          const totalConsumed = filtered.reduce((s, r) => s + (Number(r.quantity_consumed) || 0), 0);
          if (totalPrepared > 0) baselineRatio = totalConsumed / totalPrepared;
        }

        const day = new Date().getDay();
        let varianceModifier = (day === 0 || day === 6) ? 0.95 : 1.02;
        
        const expectedConsumption = Math.round(expectedAttendees * baselineRatio);
        const recommendedPrep = Math.round(expectedAttendees * (baselineRatio * 1.05 * varianceModifier));
        const expectedSurplus = Math.max(0, recommendedPrep - expectedConsumption);
        
        let wasteRisk = 'LOW';
        if (expectedSurplus > (recommendedPrep * 0.15)) wasteRisk = 'HIGH';
        else if (expectedSurplus > (recommendedPrep * 0.08)) wasteRisk = 'MODERATE';

        const confidence = Math.min(96, Math.max(74, 75 + (filtered.length * 2)));

        return {
          meal_type: mealType,
          expected_attendees: expectedAttendees,
          recommended_prep: recommendedPrep,
          expected_consumption: expectedConsumption,
          expected_surplus: expectedSurplus,
          waste_risk: wasteRisk,
          confidence_pct: confidence,
          algorithm_version: 'FOODLOOP-Heuristic-Ensemble-v2.0',
          disclaimer: 'Statistical estimate based on kitchen historical records. Final preparation quantity remains subject to institutional kitchen manager discretion.'
        };
      }
    };

    const Auth = {
      openModal(mode = 'login', role = 'INSTITUTION') {
        const content = document.getElementById('auth-modal-content');
        if (mode === 'login') {
          content.innerHTML = `
            <div class="text-center mb-6">
              <h2 class="text-2xl font-bold text-slate-800">Sign in to FOODLOOP AI</h2>
              <p class="text-sm text-slate-500 mt-1">Institutional Kitchen &amp; Surplus Logistics Portal</p>
            </div>
            <form onsubmit="Auth.handleLogin(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Email Address</label>
                <input id="login-email" type="email" required placeholder="manager@institution.org" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 text-sm">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
                <input id="login-password" type="password" required placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 text-sm">
              </div>
              <button type="submit" class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl transition shadow-md shadow-brand-600/20 text-sm">Sign In</button>
            </form>

            <div class="mt-6 text-center text-xs text-slate-500">
              Don't have an account? 
              <button onclick="Auth.openModal('register', 'INSTITUTION')" class="text-brand-600 font-semibold hover:underline">Register Institution</button> or 
              <button onclick="Auth.openModal('register', 'NGO')" class="text-brand-600 font-semibold hover:underline">Register NGO</button>
            </div>
          `;
        } else if (mode === 'register') {
          const isInst = role === 'INSTITUTION';
          content.innerHTML = `
            <div class="text-center mb-5">
              <h2 class="text-2xl font-bold text-slate-800">Register ${isInst ? 'Institutional Kitchen' : 'NGO / Trust'}</h2>
              <p class="text-xs text-slate-500 mt-1">Join the smart food reduction and redistribution ecosystem</p>
            </div>

      async handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const pass = document.getElementById('login-password').value.trim();
        const hash = await CryptoUtil.hash(pass);
        
        const users = await DB.getAll('users');
        const user = users.find(u => u.email.toLowerCase() === email.toLowerCase());
        
        if (!user || user.password_hash !== hash) {
          UI.showToast('Invalid email credentials or password', 'error');
          return;
        }

        if (user.status === 'SUSPENDED') {
          UI.showToast('Account is suspended. Contact system administrator.', 'error');
          return;
        }

        Store.setSession(user);
        await Logger.log(user.id, user.role, 'LOGIN', 'users', user.id, 'User authenticated successfully');
        Auth.closeModal();
        UI.showToast(`Welcome back, ${user.name}!`);
        App.navigate(user.role.toLowerCase());
      },

      async handleRegister(e, role) {
        e.preventDefault();
        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const phone = document.getElementById('reg-phone').value.trim();
        const address = document.getElementById('reg-address').value.trim();
        const location = document.getElementById('reg-location').value.trim();
        const contact = document.getElementById('reg-contact').value.trim();
        const pass = document.getElementById('reg-password').value.trim();

        const users = await DB.getAll('users');
        if (users.find(u => u.email.toLowerCase() === email.toLowerCase())) {
          UI.showToast('An account with this email already exists', 'error');
          return;
        }

        const passHash = await CryptoUtil.hash(pass);
        const userId = 'usr_' + Math.random().toString(36).substr(2, 8);
        const orgId = (role === 'INSTITUTION' ? 'inst_' : 'ngo_') + Math.random().toString(36).substr(2, 8);

        const mockLat = 13.0827 + (Math.random() - 0.5) * 0.1;
        const mockLng = 80.2707 + (Math.random() - 0.5) * 0.1;

        const user = {
          id: userId,
          org_id: orgId,
          email,
          password_hash: passHash,
          name,
          role,
          phone,
          status: 'ACTIVE',
          created_at: new Date().toISOString()
        };

        await DB.put('users', user);

        if (role === 'INSTITUTION') {
          const instType = document.getElementById('reg-type').value;
          await DB.put('institutions', {
            id: orgId,
            user_id: userId,
            name,
            email,
            phone,
            address,
            location,
            institution_type: instType,
            contact_person: contact,
            lat: mockLat,
            lng: mockLng,
            created_at: new Date().toISOString()
          });
        } else {
          const verificationInfo = document.getElementById('reg-verification').value;
          await DB.put('ngos', {

            user_id: userId,

            email,
            phone,

            is_verified: true,
            lat: mockLat,
            lng: mockLng,
            created_at: new Date().toISOString()

        }

        await Logger.log(userId, role, 'REGISTER', 'users', userId, `Registered as ${role}`);

        Auth.closeModal();
        UI.showToast(`Registration complete! Welcome, ${name}`);
        App.navigate(role.toLowerCase());

      async getStats(instId) {
        const foodRecords = await DB.getAll('food_records');
        const surplusRecords = await DB.getAll('surplus_food');
        const requests = await DB.getAll('food_requests');
        const deliveries = await DB.getAll('deliveries');
        const partnerships = await DB.getAll('partnerships');

        const instFood = foodRecords.filter(r => r.institution_id === instId);
        const instSurplus = surplusRecords.filter(s => s.institution_id === instId);
        const instRequests = requests.filter(r => r.institution_id === instId);
        const instDeliveries = deliveries.filter(d => d.institution_id === instId);
        const instPartners = partnerships.filter(p => p.institution_id === instId && p.status === 'ACCEPTED');

        const prepared = instFood.reduce((sum, r) => sum + (Number(r.quantity_prepared) || 0), 0);
        const consumed = instFood.reduce((sum, r) => sum + (Number(r.quantity_consumed) || 0), 0);
        const rawSurplus = instFood.reduce((sum, r) => sum + (Number(r.surplus_quantity) || 0), 0);
        
        const redistributed = instDeliveries
          .filter(d => d.status === 'COMPLETED' || d.status === 'RECEIVED')
          .reduce((sum, d) => sum + (Number(d.quantity) || 0), 0);
        
        const waste = Math.max(0, rawSurplus - redistributed);
        const activeRequests = instRequests.filter(r => r.status === 'PENDING').length;

        return {
          prepared,
          consumed,
          surplus: rawSurplus,
          redistributed,
          waste,
          activeRequests,
          connectedPartners: instPartners.length,
          instFood,
          instSurplus,
          instRequests,
          instDeliveries
        };
      },

        const sEl = document.getElementById('calc-surplus');
        const cEl = document.getElementById('calc-cons-rate');
        const spEl = document.getElementById('calc-surp-rate');
        if (sEl) sEl.textContent = `${surplus} meals`;
        if (cEl) cEl.textContent = `${consPct}%`;
        if (spEl) spEl.textContent = `${surpPct}%`;

      async handleSaveFoodRecord(e) {
        e.preventDefault();
        const inst = await InstitutionService.getCurrentInstitution();
        if (!inst) {
          UI.showToast('Institution record not resolved', 'error');
          return;
        }

        const date = document.getElementById('food-date').value;
        const mealType = document.getElementById('food-meal-type').value;
        const category = document.getElementById('food-category').value;
        const name = document.getElementById('food-name').value.trim();
        const prep = Number(document.getElementById('food-prep').value);
        const expected = Number(document.getElementById('food-expected').value);
        const cons = Number(document.getElementById('food-consumed').value);
        const prepTime = document.getElementById('food-preptime').value || new Date().toISOString();
        const storage = document.getElementById('food-storage').value;
        const deadline = document.getElementById('food-deadline').value;
        const notes = document.getElementById('food-notes').value.trim();
        const publishSurplus = document.getElementById('food-publish-surplus').checked;

        const surplus = Math.max(0, prep - cons);
        const foodRecordId = 'rec_' + Math.random().toString(36).substr(2, 8);

        const record = {
          id: foodRecordId,
          institution_id: inst.id,
          date,
          meal_type: mealType,
          category,
          food_name: name,
          quantity_prepared: prep,
          expected_people: expected,
          quantity_consumed: cons,
          surplus_quantity: surplus,
          waste_quantity: 0,
          preparation_time: prepTime,
          storage_condition: storage,
          deadline,
          notes,
          created_at: new Date().toISOString()
        };

        await DB.put('food_records', record);

        // Safety record
        await DB.put('food_safety_records', {
          id: 'safe_' + foodRecordId,
          food_record_id: foodRecordId,
          institution_id: inst.id,
          food_name: name,
          preparation_time: prepTime,
          storage_condition: storage,
          deadline,
          status: 'SAFE_WITHIN_WINDOW',
          safety_notes: notes || 'Standard institutional compliance'
        });

        // Surplus publication
        if (publishSurplus && surplus > 0) {
          await DB.put('surplus_food', {
            id: 'surp_' + foodRecordId,
            food_record_id: foodRecordId,
            institution_id: inst.id,
            institution_name: inst.name,
            food_name: name,
            total_quantity: surplus,
            available_quantity: surplus,
            reserved_quantity: 0,
            location: inst.location,
            lat: inst.lat,
            lng: inst.lng,
            preparation_time: prepTime,
            deadline: deadline,
            storage_condition: storage,
            status: 'AVAILABLE',
            created_at: new Date().toISOString()
          });

          // In-app alert to connected partner NGOs
          await Notifications.send('', 'NGO', 'Surplus Food Published', `${surplus} meals of "${name}" published by ${inst.name}.`);
        }

        await Logger.log(Store.currentUser.id, 'INSTITUTION', 'ADD_FOOD_RECORD', 'food_records', foodRecordId, { name, prep, cons, surplus });

        UI.closeActionModal();
        UI.showToast(`Food record saved! ${surplus > 0 ? surplus + ' meals published to partner loop.' : ''}`);
        App.renderInstitutionView();
      },

      async approveAndAllocateFood(requestId) {
        const req = await DB.get('food_requests', requestId);
        if (!req) return;
        const surplus = await DB.get('surplus_food', req.surplus_id);
        if (!surplus) {
          UI.showToast('Referenced surplus item is no longer available', 'error');
          return;
        }

        // Capacity and overbooking validation
        if (surplus.available_quantity < req.requested_quantity) {
          UI.showToast(`Insufficient quantity. Only ${surplus.available_quantity} meals remain available.`, 'error');
          return;
        }

        // Deduct inventory
        surplus.available_quantity -= req.requested_quantity;
        surplus.reserved_quantity += req.requested_quantity;
        if (surplus.available_quantity === 0) surplus.status = 'REQUESTED';
        await DB.put('surplus_food', surplus);

        // Update Request state
        req.status = 'APPROVED';
        req.approved_at = new Date().toISOString();
        await DB.put('food_requests', req);

        // Initiate Delivery Logistics Pipeline
        const deliveryId = 'del_' + Math.random().toString(36).substr(2, 8);
        const deliv = {
          id: deliveryId,
          request_id: req.id,
          surplus_id: surplus.id,
          institution_id: req.institution_id,
          institution_name: surplus.institution_name,
          ngo_id: req.ngo_id,
          ngo_name: req.ngo_name,
          food_name: req.food_name,
          quantity: req.requested_quantity,
          pickup_location: surplus.location,
          destination: req.destination || req.ngo_name + ' Center',
          pickup_time: req.requested_pickup_time || 'Immediate Dispatch',
          status: 'APPROVED',
          created_at: new Date().toISOString()
        };
        await DB.put('deliveries', deliv);

        // Notify Connected NGO
        await Notifications.send(req.user_id, 'NGO', 'Food Request Allocated!', `Your request for ${req.requested_quantity} meals of ${req.food_name} is approved and allocated.`);
        await Logger.log(Store.currentUser.id, 'INSTITUTION', 'APPROVE_ALLOCATE_FOOD', 'food_requests', req.id, { quantity: req.requested_quantity, deliveryId });

        UI.showToast(`Food allocated! ${req.requested_quantity} meals reserved for ${req.ngo_name}.`);
        App.renderInstitutionView();
      },

      async rejectRequest(requestId) {
        const req = await DB.get('food_requests', requestId);
        if (!req) return;
        req.status = 'REJECTED';
        await DB.put('food_requests', req);
        await Notifications.send(req.user_id, 'NGO', 'Food Request Rejected', `Institution could not allocate ${req.food_name}.`);
        UI.showToast('Request rejected.');
        App.renderInstitutionView();
      },

      async updateDeliveryStatus(deliveryId, nextStatus) {
        const deliv = await DB.get('deliveries', deliveryId);
        if (!deliv) return;
        deliv.status = nextStatus;
        deliv.updated_at = new Date().toISOString();
        if (nextStatus === 'PICKED_UP') deliv.actual_pickup_time = new Date().toISOString();
        if (nextStatus === 'DELIVERED') deliv.actual_delivery_time = new Date().toISOString();

        await DB.put('deliveries', deliv);
        await Notifications.send('', 'NGO', 'Delivery Update', `Food package "${deliv.food_name}" updated to: ${nextStatus.replace(/_/g, ' ')}`);
        await Logger.log(Store.currentUser.id, Store.currentUser.role, 'UPDATE_DELIVERY_STATUS', 'deliveries', deliveryId, nextStatus);
        UI.showToast(`Delivery status updated to ${nextStatus.replace(/_/g, ' ')}`);
        App.renderInstitutionView();
      }
    };

      async handleCreateRequest(e, surplusId) {
        e.preventDefault();
        const ngo = await NGOService.getCurrentNGO();
        const surplus = await DB.get('surplus_food', surplusId);
        if (!ngo || !surplus) return;

        const qty = Number(document.getElementById('req-qty').value);
        const people = Number(document.getElementById('req-people').value);
        const logistics = document.getElementById('req-logistics').value;
        const pickupTime = document.getElementById('req-pickuptime').value;
        const destination = document.getElementById('req-dest').value;
        const notes = document.getElementById('req-notes').value;

        if (qty > surplus.available_quantity) {
          UI.showToast(`Requested quantity exceeds available ${surplus.available_quantity} meals.`, 'error');
          return;
        }

        const reqId = 'req_' + Math.random().toString(36).substr(2, 8);
        const newReq = {
          id: reqId,
          surplus_id: surplus.id,
          food_name: surplus.food_name,
          institution_id: surplus.institution_id,
          institution_name: surplus.institution_name,
          ngo_id: ngo.id,
          ngo_name: ngo.name,
          user_id: Store.currentUser.id,
          requested_quantity: qty,
          people_to_serve: people,
          logistics_preference: logistics,
          requested_pickup_time: pickupTime,
          destination,
          notes,
          status: 'PENDING',
          created_at: new Date().toISOString()
        };

        await DB.put('food_requests', newReq);

        await Notifications.send(surplus.institution_id, 'INSTITUTION', 'New Food Request Received', `${ngo.name} requested ${qty} meals of ${surplus.food_name}.`);
        await Logger.log(Store.currentUser.id, 'NGO', 'CREATE_FOOD_REQUEST', 'food_requests', reqId, { qty, surplusId });

        UI.closeActionModal();
        UI.showToast(`Request for ${qty} meals submitted successfully!`);
        App.renderNGOView();
      },

      async confirmReceived(deliveryId) {
        const deliv = await DB.get('deliveries', deliveryId);
        if (!deliv) return;

        deliv.status = 'COMPLETED';
        deliv.actual_delivery_time = new Date().toISOString();
        deliv.receiver_confirmed = true;
        deliv.confirmed_at = new Date().toISOString();
        await DB.put('deliveries', deliv);

        const surplus = await DB.get('surplus_food', deliv.surplus_id);
        if (surplus && surplus.available_quantity <= 0) {
          surplus.status = 'RECEIVED';
          await DB.put('surplus_food', surplus);
        }

        // Record impact
        await DB.put('impact_records', {
          id: 'imp_' + deliv.id,
          delivery_id: deliv.id,
          institution_id: deliv.institution_id,
          ngo_id: deliv.ngo_id,
          food_name: deliv.food_name,
          meals_redistributed: deliv.quantity,
          co2_prevented_kg: parseFloat((deliv.quantity * 0.42).toFixed(1)),
          timestamp: new Date().toISOString()
        });

        await Notifications.send(deliv.institution_id, 'INSTITUTION', 'Delivery Confirmed Received', `${deliv.ngo_name} confirmed receipt of ${deliv.quantity} meals of ${deliv.food_name}.`);
        await Logger.log(Store.currentUser.id, 'NGO', 'CONFIRM_DELIVERY_RECEIVED', 'deliveries', deliveryId, { redistributed: deliv.quantity });

        UI.showToast(`Receipt confirmed! ${deliv.quantity} meals recorded into impact analytics.`);
        App.renderNGOView();
      }
    };

      filterRecordsTable() {
        const val = document.getElementById('record-search').value.toLowerCase();

      async deleteFoodRecord(id) {
        if (!confirm('Delete this food entry? Surplus and safety records will also be removed.')) return;
        await DB.delete('food_records', id);
        await DB.delete('surplus_food', 'surp_' + id);
        await DB.delete('food_safety_records', 'safe_' + id);
        UI.showToast('Record deleted.');
        App.renderInstitutionView();
      },

      async acceptPartnership(partId) {
        await PartnershipService.acceptConnection(partId);
        App.renderInstitutionView();
      },

      async rejectPartnership(partId) {
        await PartnershipService.rejectConnection(partId);
        App.renderInstitutionView();
      },

      renderInstCharts(stats) {
        const ctxPrep = document.getElementById('inst-chart-prep');
        const ctxPie = document.getElementById('inst-chart-pie');
        if (!ctxPrep || !ctxPie) return;

        new Chart(ctxPrep, {
          type: 'bar',
          data: {
            labels: ['Total Prepared', 'Actual Consumed', 'Total Surplus'],
            datasets: [{
              label: 'Meals',
              data: [stats.prepared, stats.consumed, stats.surplus],
              backgroundColor: ['#0f172a', '#10b981', '#f59e0b'],
              borderRadius: 8
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } }
          }
        });

        new Chart(ctxPie, {
          type: 'doughnut',
          data: {
            labels: ['Redistributed to NGOs', 'Waste'],
            datasets: [{
              data: [stats.redistributed, stats.waste],
              backgroundColor: ['#059669', '#ef4444'],
              borderWidth: 0
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom' } }
          }
        });
      },

      async renderNGOView() {
        const ngo = await NGOService.getCurrentNGO();
        const ngoId = ngo ? ngo.id : 'ngo_demo';

        const allSurplus = await DB.getAll('surplus_food');
        const allRequests = await DB.getAll('food_requests');
        const allDeliveries = await DB.getAll('deliveries');
        const allPartnerships = await DB.getAll('partnerships');

        // Only show surplus from ACCEPTED Connection Partner institutions
        const activePartnerInstIds = allPartnerships
          .filter(p => p.ngo_id === ngoId && p.status === 'ACCEPTED')
          .map(p => p.institution_id);

        const now = new Date();
        const partnerSurplus = allSurplus.filter(s => {
          return activePartnerInstIds.includes(s.institution_id) && 
                 s.available_quantity > 0 && 
                 new Date(s.deadline) > now && 
                 s.status === 'AVAILABLE';
        });

        const ngoRequests = allRequests.filter(r => r.ngo_id === ngoId);
        const ngoDeliveries = allDeliveries.filter(d => d.ngo_id === ngoId);

        const root = document.getElementById('app-root');
        root.innerHTML = ViewRenderer.renderNGOMarketplace(partnerSurplus, ngoRequests, ngoDeliveries, activePartnerInstIds.length);
        this.setNGOTab(Store.activeTab || 'available');
      },

        if (!container) return;

        const ngoId = ngo ? ngo.id : 'ngo_demo';

        const allSurplus = await DB.getAll('surplus_food');
        const allInstitutions = await DB.getAll('institutions');
        const allPartnerships = await DB.getAll('partnerships');
        const allRequests = await DB.getAll('food_requests');
        const allDeliveries = await DB.getAll('deliveries');

        const myPartnerships = allPartnerships.filter(p => p.ngo_id === ngoId);
        const activePartnerInstIds = myPartnerships.filter(p => p.status === 'ACCEPTED').map(p => p.institution_id);

        const now = new Date();
        const partnerSurplus = allSurplus.filter(s => {
          return activePartnerInstIds.includes(s.institution_id) && 
                 s.available_quantity > 0 && 
                 new Date(s.deadline) > now;
        });

        const ngoRequests = allRequests.filter(r => r.ngo_id === ngoId);
        const ngoDeliveries = allDeliveries.filter(d => d.ngo_id === ngoId);

        if (tabName === 'available') {
          container.innerHTML = `
